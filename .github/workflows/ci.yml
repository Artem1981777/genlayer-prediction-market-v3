name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic lifecycle simulation
        run: python sim_market.py
